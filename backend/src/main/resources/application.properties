spring.application.name=demo

# MySQL configuration. Override these values with environment variables for
# deployed environments or a local database with different credentials.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/hostel_management}
spring.datasource.username=${DB_USERNAME:springstudent}
spring.datasource.password=${DB_PASSWORD:springstudent}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
server.error.include-message=always

app.auth.jwt-secret=${JWT_SECRET}
app.auth.jwt-expiration-seconds=${JWT_EXPIRATION_SECONDS:604800}
app.auth.university-email-domain=${UNIVERSITY_EMAIL_DOMAIN:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
