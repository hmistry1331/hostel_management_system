spring.application.name=demo
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
server.error.include-message=always

app.auth.jwt-secret=${JWT_SECRET}
app.auth.jwt-expiration-seconds=${JWT_EXPIRATION_SECONDS:604800}
app.auth.university-email-domain=${UNIVERSITY_EMAIL_DOMAIN:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
