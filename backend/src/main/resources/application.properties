spring.application.name=demo

# MySQL configuration. Override these values with environment variables for
# deployed environments or a local database with different credentials.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

app.auth.jwt-secret=${JWT_SECRET}
app.auth.jwt-expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
